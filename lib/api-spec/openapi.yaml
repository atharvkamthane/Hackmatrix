openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HackMatrix Healthcare Consent & Clinical Exchange API
servers:
  - url: /api
    description: Base API path
tags:
  - name: system
    description: System health and readiness operations
  - name: auth
    description: Authentication and server-enforced role verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [system]
      summary: Health check
      description: Returns server process liveness status
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [system]
      summary: Readiness check
      description: Returns database connection readiness status
      responses:
        "200":
          description: Databases are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Databases unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /auth/me:
    get:
      operationId: getAuthenticatedUser
      tags: [auth]
      summary: Get authenticated user context
      description: Returns normalized server-controlled user identity and role from Clerk token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/test/patient:
    get:
      operationId: testPatientRole
      tags: [auth]
      summary: Verify patient role access
      description: Internal protected route requiring PATIENT role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTestResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - role mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/test/clinician:
    get:
      operationId: testClinicianRole
      tags: [auth]
      summary: Verify clinician role access
      description: Internal protected route requiring CLINICIAN role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTestResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - role mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/test/admin:
    get:
      operationId: testAdminRole
      tags: [auth]
      summary: Verify admin role access
      description: Internal protected route requiring ADMIN role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleTestResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - role mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/test/organization/{organizationId}:
    get:
      operationId: testOrganizationMatch
      tags: [auth]
      summary: Verify organization match
      description: Internal protected route requiring verified organization match
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          description: Target organization ID
      responses:
        "200":
          description: Organization matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - organization mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-verified Clerk session token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          example: ready
      required:
        - status
    AuthMeResponse:
      type: object
      properties:
        userId:
          type: string
          example: user_2sA19x...
        role:
          type: string
          enum: [PATIENT, CLINICIAN, ADMIN]
          example: PATIENT
        organizationId:
          type: string
          nullable: true
          example: org_2sB84k...
      required:
        - userId
        - role
    RoleTestResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        role:
          type: string
          enum: [PATIENT, CLINICIAN, ADMIN]
      required:
        - status
        - role
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHENTICATED
            message:
              type: string
              example: Authentication is required.
            requestId:
              type: string
              example: f86a9d63-701a-4558-8f2b-74125d1f9ecd
          required:
            - code
            - message
      required:
        - error
